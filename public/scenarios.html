<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Blocks - Scenarios</title>
  <link rel="preload" href="/fonts/Manrope-latin-variable.woff2" as="font" type="font/woff2" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">MoneyBlocks</div>
      <nav class="nav">
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/chart" class="nav-link">Markets &amp; Charts</a>
        <a href="/trade" class="nav-link">Trade</a>
        <a href="/scenarios" class="nav-link active">Scenarios <span id="scenarios-badge" class="badge badge-danger" style="display:none; margin-left: auto;"></span></a>
        <a href="/activity" class="nav-link">Activity</a>
        <a href="/manager" class="nav-link" id="managerLink" style="display:none;">Admin</a>
      </nav>
      <div class="sidebar-footer">
        <div id="ws-status" class="status-indicator disconnected"></div>
      </div>
    </aside>

    <main class="main">
      <div class="top-bar">
        <div class="page-heading">
          <h2>Crisis Scenarios</h2>
          <p class="page-subtitle">Read live market stories, simulation events, and manager-published scenarios that can affect trading decisions.</p>
        </div>
        <div class="user-info">
          <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
        </div>
      </div>

      <div id="scenariosError" class="alert alert-error" style="display:none;"></div>

      <div class="content-stack">
        <section id="scenarioMetrics" class="metric-grid" aria-label="Scenario summary"></section>

        <section class="card full-width">
          <div class="section-header">
            <div>
              <h3>Live Scenario Feed</h3>
              <p>Unread items stay highlighted until you mark them as reviewed.</p>
            </div>
          </div>
          <div id="scenariosList" class="stock-grid">
            <p>Loading...</p>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/scenarios.js"></script>
  <script type="module" src="/js/notifications.js"></script>
</body>
</html>
